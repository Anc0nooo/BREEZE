# Breeze version + self-update settings. ASCII only:
# java.util.Properties reads this as ISO-8859-1, so Chinese comments turn into
# garbage and can swallow the next line (which silently drops updateBase).
#
# versionCode MUST be bumped for every release, otherwise phones see no update.
versionCode=3
versionName=1.1.1
# Directory that serves latest.json + the APK. MUST end with a slash and MUST be https
# (the app has usesCleartextTraffic=false).
updateBase=https://anc0n.xyz/breeze/
