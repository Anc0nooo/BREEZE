# Breeze version + self-update settings. ASCII only:
# java.util.Properties reads this as ISO-8859-1, so Chinese comments turn into
# garbage and can swallow the next line (which silently drops updateBase).
#
# versionCode MUST be bumped for every release, otherwise phones see no update.
versionCode=4
versionName=1.2.0

# Where the app looks for latest.json. MUST be https and MUST end with a slash
# (usesCleartextTraffic=false, so http candidates are dropped by the platform).
#
# Two supported layouts:
#
#   1) GitHub Release (default): CI attaches latest.json + breeze-<ver>.apk to the
#      newest non-prerelease release, and "releases/latest/download" always points
#      at it, so there is nothing to host. Fork, set the four signing secrets, done.
#
#   2) Your own web server: point this at the directory holding those two files,
#      e.g. https://example.com/breeze/
#
# Override order: -PupdateBase=... (gradle) > BREEZE_UPDATE_BASE (env) > this line.
updateBase=https://github.com/Anc0nooo/BREEZE/releases/latest/download/
